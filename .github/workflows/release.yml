name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} -p dddown-server

      - name: Prepare asset
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            # macOS 打成 DDDown.app + dmg，双击即用
            VERSION="${{ github.ref_name }}"
            ASSET="DDDown-${{ github.ref_name }}-${{ matrix.label }}.dmg"
            bash packaging/package-mac.sh "target/${{ matrix.target }}/release/dddown" "${VERSION#v}" "$ASSET"
          else
            EXT=""
            [[ "${{ matrix.os }}" == "windows-latest" ]] && EXT=".exe"
            ASSET="dddown-${{ github.ref_name }}-${{ matrix.label }}${EXT}"
            cp "target/${{ matrix.target }}/release/dddown${EXT}" "$ASSET"
          fi
          echo "BIN=$ASSET" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BIN }}

  # Tauri 桌面端打包（macOS .app/.dmg + Windows .msi/.exe + Linux .deb/.AppImage）
  desktop:
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Linux 需要系统依赖
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 构建前端
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      # 构建 server release 二进制（作为 sidecar 嵌入 .app）
      - name: Build server binary
        run: cargo build --release --target ${{ matrix.target }} -p dddown-server

      # 复制 server 到 sidecar 位置（带 target-triple 后缀）
      - name: Prepare sidecar
        shell: bash
        run: |
          SIDECAR_DIR="crates/dddown-desktop/binaries"
          mkdir -p "$SIDECAR_DIR"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/dddown.exe" "$SIDECAR_DIR/dddown-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/dddown" "$SIDECAR_DIR/dddown-${{ matrix.target }}"
          fi

      # Tauri 打包
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/dddown-desktop
          args: --target ${{ matrix.target }}

      # 上传产物到 release
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            crates/dddown-desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            crates/dddown-desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
            crates/dddown-desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            crates/dddown-desktop/target/${{ matrix.target }}/release/bundle/msi/*.msi
            crates/dddown-desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
